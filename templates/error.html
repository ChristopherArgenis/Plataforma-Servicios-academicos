{% extends 'base.html' %}
{% block title %}Error {{ code }}{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block body %}
<main class="auth-card card shadow-sm text-center">
    <div class="card-body p-4">
        <h1 class="display-5">{{ code }}</h1>
        <p>{{ message }}</p>
        <a href="{{ url_for('auth.auth_page') }}" class="btn btn-primary">Volver al inicio</a>
    </div>
</main>
{% endblock %}
