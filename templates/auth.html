<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header><h2>Login or Register</h2></header>
    <!-- Form for registration and login -->
    <form method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <!-- Buttons to either register or login -->
        <button type="submit" formaction="{{ url_for('user.login') }}">Login</button>
        <button type="submit" formaction="{{ url_for('user.register') }}">Register</button>
    </form>
</body>
</html>
